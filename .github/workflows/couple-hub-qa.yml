name: Couple Hub Isolated App
on:
  push:
    paths: ["apps/couple-hub/**", ".github/workflows/couple-hub-qa.yml"]
  pull_request:
    paths: ["apps/couple-hub/**", ".github/workflows/couple-hub-qa.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/couple-hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/couple-hub/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
